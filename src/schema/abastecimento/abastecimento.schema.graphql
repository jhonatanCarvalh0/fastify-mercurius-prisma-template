scalar DateTime

input DateRangeInput {
  from: DateTime!
  to: DateTime!
}

input AbastecimentoFiltersInput {
  dateRange: DateRangeInput
  status: [String!]
  fuelType: [String!]
  vehiclePlate: String
  driverName: String
  orgao: [String!]
  combustivel: [String!]
  condutor: [String!]
  placa: [String!]
}

type Vehicle {
  plate: String
  model: String
  brand: String
}

type GasStation {
  name: String
  city: String
}

type Abastecimento {
  id: ID!
  datetime: DateTime
  cost: Float
  fuelVolume: Float
  fuelType: String
  status: String
  driverName: String

  vehicle: Vehicle
  gasStation: GasStation

  department: String
  costCenter: String
}

type AbastecimentoColumn {
  headerLabel: String!
  accessor: String!
  isSortable: Boolean!
  dataType: String!
}

type KpiAbastecimentoData {
  totalGasto: Float!
  totalLitros: Float!
  totalAbastecimentos: Int!
}

type CombustivelGasto {
  tipo: String!
  totalLitros: Float!
  totalGasto: Float!
}

type OrgaoGastoAbastecimento {
  name: String!
  total: Float!
}

type GastoMesAbastecimento {
  month: String!
  total: Float!
}

type FilterOptionsAbastecimento {
  orgao: [String!]
  condutor: [String!]
  placa: [String!]
}

type Query {
  abastecimentos(
    limit: Int
    offset: Int
    sortBy: String
    sortDirection: String
    filters: AbastecimentoFiltersInput
  ): [Abastecimento!]!

  abastecimentosColumns: [AbastecimentoColumn!]!

  abastecimentosCount(filters: AbastecimentoFiltersInput): Int!

  kpisAbastecimento(filters: AbastecimentoFiltersInput): KpiAbastecimentoData!

  gastoPorCombustivel(filters: AbastecimentoFiltersInput): [CombustivelGasto!]

  gastoPorOrgao(filters: AbastecimentoFiltersInput): [OrgaoGastoAbastecimento!]

  gastoMensalAbastecimento(
    filters: AbastecimentoFiltersInput
  ): [GastoMesAbastecimento!]

  filterOptionsAbastecimento: FilterOptionsAbastecimento!
}
