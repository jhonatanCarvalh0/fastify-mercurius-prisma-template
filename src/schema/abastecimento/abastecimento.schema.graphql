scalar DateTime

input DateRangeInput {
  from: DateTime!
  to: DateTime!
}

input AbastecimentoFiltersInput {
  dateRange: DateRangeInput
  status: [String!]
  fuelType: [String!]
  vehiclePlate: String
  driverName: String
  orgao: [String!]
}

type Vehicle {
  plate: String
  model: String
  brand: String
}

type GasStation {
  name: String
  city: String
}

type Abastecimento {
  id: ID!
  datetime: DateTime
  cost: Float
  fuelVolume: Float
  fuelType: String
  status: String
  driverName: String
  vehicle: Vehicle
  gasStation: GasStation
  department: String
  costCenter: String
}

type AbastecimentoColumn {
  headerLabel: String!
  accessor: String!
  isSortable: Boolean!
  dataType: String!
}

type AbastecimentoKpis {
  totalCost: Float!
  dailyAverageCost: Float!
  suppliesCount: Int!
  lastUpdate: DateTime!
}

type FilterOption {
  value: String!
  label: String!
}

type CostByVehicle {
  vehicle: String!
  total: Float!
}

type CostByStatus {
  status: String!
  total: Float!
}

type Query {
  abastecimentos(
    limit: Int
    offset: Int
    sortBy: String
    sortDirection: String
    filters: AbastecimentoFiltersInput
  ): [Abastecimento!]!

  abastecimentosCount(filters: AbastecimentoFiltersInput): Int!

  abastecimentoKpis: AbastecimentoKpis!

  vehicleOptions: [FilterOption!]!
  statusOptions: [FilterOption!]!

  costByVehicle: [CostByVehicle!]!
  costByStatus: [CostByStatus!]!

  abastecimentosColumns: [AbastecimentoColumn!]!
}
