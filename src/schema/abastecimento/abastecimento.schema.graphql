scalar DateTime

input DateRangeInput {
  from: DateTime!
  to: DateTime!
}

input AbastecimentoFiltersInput {
  dateRange: DateRangeInput
  fuelType: [String!]
  vehiclePlate: String
  driverName: String
  department: [String!]     # ou String, se quiser só um valor
  vehicleModel: [String]
  gasStationCity: [String]
  gasStationName: [String]
}

type Vehicle {
  plate: String
  model: String
  brand: String
}

type GasStation {
  name: String
  city: String
}

type Abastecimento {
  id: ID!
  datetime: DateTime
  cost: Float
  fuelVolume: Float
  fuelType: String
  driverName: String
  vehicle: Vehicle
  gasStation: GasStation
  department: String
  costCenter: String
}

type AbastecimentoColumn {
  headerLabel: String!
  accessor: String!
  isSortable: Boolean!
  dataType: String!
}

type AbastecimentoKpis {
  totalCost: Float!
  dailyAverageCost: Float!
  suppliesCount: Int!
  lastUpdate: DateTime!
}

type FilterOption {
  value: String
  label: String
}

type CostByVehicle {
  vehicle: String!
  total: Float!
}

type Query {
  abastecimentos(
    limit: Int
    offset: Int
    sortBy: String
    sortDirection: String
    filters: AbastecimentoFiltersInput
  ): [Abastecimento!]!

  abastecimentosCount(filters: AbastecimentoFiltersInput): Int!
  abastecimentoKpis: AbastecimentoKpis!
  costByVehicle: [CostByVehicle!]!

  departmentOptions: [FilterOption]
  vehiclePlateOptions: [FilterOption]
  vehicleModelOptions: [FilterOption]
  gasStationCityOptions: [FilterOption]
  gasStationNameOptions: [FilterOption]


  abastecimentosColumns: [AbastecimentoColumn!]!
}
